services:
  postgres:
    image: postgres:18-alpine
    container_name: planning-poker
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: planning-poker-db
    ports:
      - "8432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
